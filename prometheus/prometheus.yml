global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ai-taxi-model'
    environment: 'development'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Kafka metrics (if JMX exporter is configured)
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']
        labels:
          service: 'kafka'

  # OpenSearch metrics
  - job_name: 'opensearch'
    scrape_interval: 15s
    metrics_path: '/_prometheus/metrics'
    static_configs:
      - targets: ['opensearch:9200']
        labels:
          service: 'opensearch'
          application: 'opensearch'
    # Basic authentication for OpenSearch (when security is enabled)
    basic_auth:
      username: 'admin'
      password: 'SuperSecret123!'
    # Skip TLS verification if using self-signed certificates
    tls_config:
      insecure_skip_verify: true

  # Quarkus Taxi Monitor Service
  - job_name: 'taxi-monitor'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'taxi-monitor'
          application: 'ai-taxi-model'
    metrics_path: '/q/metrics'
    scrape_interval: 15s

  # PostgreSQL exporter (if added)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #       labels:
  #         service: 'postgres'

