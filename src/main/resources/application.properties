# Quarkus Application Configuration
# Default configuration (used when no profile is specified)
# Profile-specific configurations are in:
# - application-dev.properties (development)
# - application-prod.properties (production)

# Taxi Monitor Configuration (default)
# Enable/disable TaxiMonitor service (processes files and indexes to OpenSearch)
taxi.monitor.enabled=true
taxi.monitor.input.dir=./data/input
taxi.monitor.error.dir=./data/error
taxi.monitor.processed.dir=./data/processed

# Parquet File Directory Monitor Configuration (default)
# Enable/disable ParquetFileDirectoryMonitor service (processes files and stores to PostgreSQL)
parquet.monitor.enabled=true
parquet.monitor.input.dir=./data/parquet-input
parquet.monitor.error.dir=./data/parquet-error
parquet.monitor.processed.dir=./data/parquet-processed
parquet.monitor.batch.size=10
parquet.monitor.batch.timer.seconds=30
parquet.database.batch.size=1000

# OpenSearch Configuration (default)
opensearch.host=localhost
opensearch.port=9200
opensearch.scheme=https
opensearch.username=admin
opensearch.password=admin

# Quarkus Logging (default)
quarkus.log.level=INFO
quarkus.log.category."com.bscllc.ai.text.model".level=INFO

# Quarkus Scheduler
quarkus.scheduler.enabled=true

# Quarkus HTTP Server
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Quarkus Micrometer Prometheus
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# Database Configuration
db.url=jdbc:postgresql://localhost:5432/ai_taxi_model
db.username=postgres
db.password=postgres
db.schema=public

# Database SSL/TLS Configuration (for secure connections)
# Set to true to enable SSL/TLS encryption for database connections
db.ssl.enabled=false
# SSL mode: require (encrypts connection, accepts self-signed certs),
#            verify-ca (verifies CA certificate), 
#            verify-full (verifies CA and hostname),
#            prefer (try SSL, fallback to non-SSL),
#            allow (try non-SSL first, then SSL),
#            disable (no SSL)
db.ssl.mode=require
# Path to root CA certificate file (for verify-ca or verify-full modes)
# db.ssl.rootcert=./certs/postgres/root-ca.pem
# Path to client certificate file (for client certificate authentication)
# db.ssl.cert=./certs/postgres/client-cert.pem
# Path to client private key file (for client certificate authentication)
# db.ssl.key=./certs/postgres/client-key.pem

