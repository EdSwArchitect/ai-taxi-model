# Quarkus Development Profile Configuration

# Taxi Monitor Configuration (Development)
# Enable/disable TaxiMonitor service (processes files and indexes to OpenSearch)
taxi.monitor.enabled=true
taxi.monitor.input.dir=./data/input
taxi.monitor.error.dir=./data/error
taxi.monitor.processed.dir=./data/processed

# Parquet File Directory Monitor Configuration (Development)
# Enable/disable ParquetFileDirectoryMonitor service (processes files and stores to PostgreSQL)
parquet.monitor.enabled=true
parquet.monitor.input.dir=./data/parquet-input
parquet.monitor.error.dir=./data/parquet-error
parquet.monitor.processed.dir=./data/parquet-processed
parquet.monitor.batch.size=10
parquet.monitor.batch.timer.seconds=30
parquet.database.batch.size=1000

# OpenSearch Configuration (Development - localhost)
opensearch.host=localhost
opensearch.port=9200
opensearch.scheme=https
opensearch.username=admin
opensearch.password=admin

# OpenSearch Bulk Indexing Rate Limiting (Development)
opensearch.bulk.index.delay.ms=100
opensearch.bulk.index.max.concurrent=2

# Quarkus Logging (Development - more verbose)
quarkus.log.level=INFO
quarkus.log.category."com.bscllc.ai.text.model".level=DEBUG
quarkus.log.category."org.opensearch".level=DEBUG

# Quarkus Scheduler
quarkus.scheduler.enabled=true

# Quarkus HTTP Server (Development)
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Quarkus Micrometer Prometheus (Development)
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics


# Database Configuration (Development)
db.url=jdbc:postgresql://localhost:5432/ai_taxi_model
db.username=postgres
db.password=postgres
db.schema=public
db.ssl.enabled=false
db.ssl.mode=require

# Quarkus Dev Mode Settings
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n

