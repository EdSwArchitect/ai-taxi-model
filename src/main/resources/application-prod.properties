# Quarkus Production Profile Configuration

# Taxi Monitor Configuration (Production)
taxi.monitor.input.dir=/var/lib/taxi-monitor/input
taxi.monitor.error.dir=/var/lib/taxi-monitor/error
taxi.monitor.processed.dir=/var/lib/taxi-monitor/processed

# OpenSearch Configuration (Production - configure via environment variables)
# These can be overridden via environment variables or Kubernetes ConfigMaps
opensearch.host=${OPENSEARCH_HOST:opensearch}
opensearch.port=${OPENSEARCH_PORT:9200}
opensearch.scheme=${OPENSEARCH_SCHEME:https}
opensearch.username=${OPENSEARCH_USERNAME:admin}
opensearch.password=${OPENSEARCH_PASSWORD:admin}

# Quarkus Logging (Production - less verbose)
quarkus.log.level=INFO
quarkus.log.category."com.bscllc.ai.text.model".level=INFO
quarkus.log.category."org.opensearch".level=WARN
quarkus.log.category."org.apache".level=WARN

# Quarkus Scheduler
quarkus.scheduler.enabled=true

# Quarkus HTTP Server (Production)
quarkus.http.port=${QUARKUS_HTTP_PORT:8080}
quarkus.http.host=0.0.0.0

# Quarkus Micrometer Prometheus (Production)
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# Production optimizations
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n

