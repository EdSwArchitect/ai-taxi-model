# Quarkus Production Profile Configuration

# Taxi Monitor Configuration (Production)
# Enable/disable TaxiMonitor service (processes files and indexes to OpenSearch)
taxi.monitor.enabled=${TAXI_MONITOR_ENABLED:true}
taxi.monitor.input.dir=${TAXI_MONITOR_INPUT_DIR:/var/lib/taxi-monitor/input}
taxi.monitor.error.dir=${TAXI_MONITOR_ERROR_DIR:/var/lib/taxi-monitor/error}
taxi.monitor.processed.dir=${TAXI_MONITOR_PROCESSED_DIR:/var/lib/taxi-monitor/processed}

# Parquet File Directory Monitor Configuration (Production)
# Enable/disable ParquetFileDirectoryMonitor service (processes files and stores to PostgreSQL)
parquet.monitor.enabled=${PARQUET_MONITOR_ENABLED:true}
parquet.monitor.input.dir=${PARQUET_MONITOR_INPUT_DIR:/var/lib/parquet-monitor/input}
parquet.monitor.error.dir=${PARQUET_MONITOR_ERROR_DIR:/var/lib/parquet-monitor/error}
parquet.monitor.processed.dir=${PARQUET_MONITOR_PROCESSED_DIR:/var/lib/parquet-monitor/processed}
parquet.monitor.batch.size=${PARQUET_MONITOR_BATCH_SIZE:10}
parquet.monitor.batch.timer.seconds=${PARQUET_MONITOR_BATCH_TIMER_SECONDS:30}
parquet.database.batch.size=${PARQUET_DATABASE_BATCH_SIZE:1000}

# OpenSearch Configuration (Production - configure via environment variables)
# These can be overridden via environment variables or Kubernetes ConfigMaps
opensearch.host=${OPENSEARCH_HOST:opensearch}
opensearch.port=${OPENSEARCH_PORT:9200}
opensearch.scheme=${OPENSEARCH_SCHEME:https}
opensearch.username=${OPENSEARCH_USERNAME:admin}
opensearch.password=${OPENSEARCH_PASSWORD:admin}

# OpenSearch Bulk Indexing Rate Limiting (Production)
opensearch.bulk.index.delay.ms=${OPENSEARCH_BULK_INDEX_DELAY_MS:100}
opensearch.bulk.index.max.concurrent=${OPENSEARCH_BULK_INDEX_MAX_CONCURRENT:2}

# GeoMesa Configuration (Production - configure via environment variables)
geomesa.ingestion.enabled=${GEOMESA_INGESTION_ENABLED:true}
geomesa.datastore.type=${GEOMESA_DATASTORE_TYPE:filesystem}
geomesa.filesystem.path=${GEOMESA_FILESYSTEM_PATH:/var/lib/geomesa}
geomesa.hbase.catalog=${GEOMESA_HBASE_CATALOG:geomesa}
geomesa.hbase.zookeepers=${GEOMESA_HBASE_ZOOKEEPERS:hbase:2181}
geomesa.ingestion.batch.size=${GEOMESA_INGESTION_BATCH_SIZE:1000}

# Quarkus Logging (Production - less verbose)
quarkus.log.level=INFO
quarkus.log.category."com.bscllc.ai.text.model".level=INFO
quarkus.log.category."org.opensearch".level=WARN
quarkus.log.category."org.apache".level=WARN

# Quarkus Scheduler
quarkus.scheduler.enabled=true

# Quarkus HTTP Server (Production)
quarkus.http.port=${QUARKUS_HTTP_PORT:8080}
quarkus.http.host=0.0.0.0

# Quarkus Micrometer Prometheus (Production)
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

